<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Load EB Garamond for standalone preview (same stylesheet as index.html) -->
  <style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;display=swap');</style>

  <!-- Transparent background for flexible color application -->
  <rect width="100%" height="100%" fill="none" />

  <!-- D/H monogram; colors and font copied from the site logo (style.css .mark-d/.mark-h, var serif) -->
  <text x="250" y="350" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="300" fill="#172A3A" text-anchor="middle">D</text>
  <text x="345" y="423.125" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="300" fill="#80604E" text-anchor="middle">H</text>
</svg>
